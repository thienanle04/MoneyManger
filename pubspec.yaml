name: money_manager
description: Personal finance cockpit — fast capture, leaks, NAV, multi-currency.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  drift: ^2.22.1
  flutter_riverpod: ^2.6.1
  intl: any
  path: ^1.9.1
  path_provider: ^2.1.5
  sqlite3_flutter_libs: ^0.5.28
  uuid: ^4.5.1
  forui: ^0.24.3
  hugeicons: ^1.1.7
  remix_icons_flutter: ^4.9.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.22.1
  forui_cli: ^0.24.0

flutter:
  generate: true
  uses-material-design: true
